name: Deploy project docsite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Archify validates diagram evidence against pinned historical commits.
          fetch-depth: 0

      - name: Set up Python
        if: hashFiles('scripts/concorde.py') != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # This project's own source checkout distributes Concorde itself, so its docsite publishes
      # rendered Agent instructions/Wire contracts pages from generated/docs/*.json; that Concorde
      # build must run before the docsite steps below. An ordinary scaffolded consumer project has
      # no scripts/concorde.py at its root, so this step is a no-op there.
      - name: Build Concorde (Skills, roles, Protocol assets, docs projections)
        if: hashFiles('scripts/concorde.py') != ''
        run: python3 scripts/concorde.py build

      - name: Install dependencies
        run: npm ci --prefix docsite

      - name: Build verified docsite
        run: npm --prefix docsite run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docsite/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
