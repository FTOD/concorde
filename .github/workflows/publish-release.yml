name: Publish Concorde release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the publication plan without creating or changing a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install development environment
        run: uv sync

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(uv run python scripts/release/build-release.py --print-version)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests/concorde/unit -p 'test_*.py'

      - name: Run release contract tests
        run: uv run python -m unittest discover -s tests/concorde/contract -p 'test_release*.py'

      - name: Build standalone release
        run: uv run python scripts/release/build-release.py --output dist

      - name: Verify release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run python scripts/release/verify-release.py --dist dist \
            --expect-version "${TAG#v}" \
            --expect-base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -o pipefail
          args="--dist dist --tag ${TAG}"
          if [ "${DRY_RUN}" = "true" ]; then
            args="${args} --dry-run"
          fi
          uv run python scripts/release/publish-release.py ${args} | tee publication-record.json
          {
            echo "## Publication record (${TAG})"
            echo '```json'
            cat publication-record.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
