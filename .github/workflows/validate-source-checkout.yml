name: Validate source checkout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build
        run: python3 scripts/concorde.py build

      - name: Require the build is current
        run: python3 scripts/concorde.py build --check

      - name: Validate the Spec and package
        run: python3 scripts/concorde.py validate

      - name: Test build, resolver and worktree-affinity contracts
        run: |
          python3 -m unittest \
            tests.concorde.capabilities.unit.test_build \
            tests.concorde.capabilities.unit.test_prompt_resolver \
            tests.concorde.capabilities.unit.test_worktree_affinity \
            tests.concorde.capabilities.unit.test_capability_modules

  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install optional Studio development runtime
        run: |
          python3 -m pip install uv
          uv sync --locked --group studio

      - name: Build
        run: python3 scripts/concorde.py build

      - name: Test Studio graphs, transport and real Agent Server
        env:
          PYTHONPATH: src
          CONCORDE_TEST_STUDIO: "1"
        run: |
          .venv/bin/python -m unittest \
            tests.concorde.capabilities.unit.test_studio \
            tests.concorde.capabilities.unit.test_studio_client \
            tests.concorde.capabilities.integration.test_studio_server
