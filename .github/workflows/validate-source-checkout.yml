name: Validate source checkout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python development dependencies
        run: |
          python3 -m pip install uv
          uv sync --locked --group dev

      - name: Install system sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Nested sandbox tests require user namespaces on this disposable Ubuntu runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Diagrams in the Specs are D2, rendered by the d2 program (github.com/d2lang/d2).
      # The release is pinned and its archive checked against the published SHA-256.
      - name: Install d2
        env:
          D2_VERSION: v0.9.0
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          archive="$RUNNER_TEMP/d2.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -D --mode 0755 "$RUNNER_TEMP/d2-${D2_VERSION}/bin/d2" "$HOME/.local/bin/d2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" --version

      - name: Build
        run: python3 scripts/concorde.py build

      - name: Require the build is current
        run: python3 scripts/concorde.py build --check

      - name: Validate the Spec and package
        run: python3 scripts/concorde.py validate

      - name: Run the full Python test suite
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest --reason=independent --scope=full

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Install docsite dependencies
        run: npm ci --prefix docsite

      - name: Typecheck the docsite
        # Prepare the generated sidebar in a temporary copy, including on a fresh checkout.
        run: python3 scripts/development/check-docsite-types.py

      - name: Test the docsite
        run: npm test --prefix docsite

      # Fails when generated/build-manifest.json is missing or stale, so the docsite never lags
      # the Concorde build above.
      - name: Validate the docsite against the current build
        run: npm --prefix docsite run validate
