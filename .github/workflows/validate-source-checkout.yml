name: Validate source checkout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python development dependencies
        run: |
          python3 -m pip install uv
          uv sync --locked --group dev

      - name: Install system sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Nested sandbox tests require user namespaces on this disposable Ubuntu runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        run: python3 scripts/concorde.py build

      - name: Require the build is current
        run: python3 scripts/concorde.py build --check

      - name: Validate the Spec and package
        run: python3 scripts/concorde.py validate

      - name: Run the full Python test suite
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m unittest discover -s tests/concorde -t . -p test_*.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Install docsite dependencies
        run: npm ci --prefix docsite

      - name: Typecheck the docsite
        # Prepare the generated sidebar in a temporary copy, including on a fresh checkout.
        run: python3 scripts/development/check-docsite-types.py

      - name: Test the docsite
        run: npm test --prefix docsite

      # Publishes rendered Agent instructions/Wire contracts from generated/docs/*.json and fails
      # when generated/build-manifest.json is missing or stale, so the docsite never lags the
      # Concorde build above.
      - name: Validate the docsite against the current build
        run: npm --prefix docsite run validate

  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install optional Studio development runtime
        run: |
          python3 -m pip install uv
          uv sync --locked --group studio

      - name: Install system sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Nested sandbox tests require user namespaces on this disposable Ubuntu runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        run: python3 scripts/concorde.py build

      - name: Test Studio graphs, transport and real Agent Server
        env:
          PYTHONPATH: src
          CONCORDE_TEST_STUDIO: "1"
        run: |
          .venv/bin/python -m unittest \
            tests.concorde.harness.test_studio \
            tests.concorde.harness.test_studio_client \
            tests.concorde.harness.test_studio_server
