schema_version: "1.0"

preset:
  id: "concorde"
  name: "Concorde"
  version: "0.4.0"
  description: "Architecture templates and authoritative two-level feature-workspace routing for Spec Kit"
  author: "Concorde maintainers"
  repository: "https://github.com/FTOD/concorde"
  license: "MIT"

requires:
  speckit_version: ">=0.16.4,<0.16.5"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/design-template.md"
      description: "Concorde feature/sub-feature design authority, ownership, and contract addendum"
      strategy: "append"
    - type: "template"
      name: "abstract-template"
      file: "templates/abstract-template.md"
      description: "Self-contained feature abstract (abstract.md) authored by specification and kept current by clarification"
      strategy: "replace"
    - type: "template"
      name: "implementation-template"
      file: "templates/implementation-template.md"
      description: "Placeholder durable feature implementation (implementation.md) written in full only by Concorde acceptance"
      strategy: "replace"
    - type: "template"
      name: "reflections-template"
      file: "templates/reflections-template.md"
      description: "Project-wide reflection log at the specification root, appended to by every phase after specification"
      strategy: "replace"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Concorde bounded architecture planning gates"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Concorde architecture and evidence task guidance"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Resolve the selected feature/sub-feature and parent context before specification"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Resolve the selected feature/sub-feature and parent context before clarification"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Route requirements checklists to temporal attempt/checklists/"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Route implementation planning below attempt/"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Route task generation below attempt/"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Execute the selected feature attempt workspace"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze the selected temporal implementation artifacts"
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Converge the selected temporal implementation artifacts"
      strategy: "replace"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Convert tasks from the selected attempt workspace"
      strategy: "replace"
    - type: "command"
      name: "speckit.fast-loop"
      file: "commands/speckit.fast-loop.md"
      description: "Directly reconcile one eligible small change without an attempt"
      strategy: "replace"

tags:
  - "architecture"
  - "contracts"
  - "spec-driven-development"
