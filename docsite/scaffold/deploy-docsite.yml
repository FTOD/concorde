name: Deploy project docsite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: hashFiles('scripts/concorde.py') != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Build source-checkout runtime assets before publication.
      # Scaffolded consumers have no Framework build command at their root.
      - name: Build Concorde (Pi catalog, worker instructions, Protocol assets)
        if: hashFiles('scripts/concorde.py') != ''
        run: python3 scripts/concorde.py build

      # Diagrams in the Specs are D2, rendered by the d2 program (github.com/d2lang/d2).
      # The release is pinned and its archive checked against the published SHA-256.
      - name: Install d2
        env:
          D2_VERSION: v0.9.0
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          archive="$RUNNER_TEMP/d2.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -D --mode 0755 "$RUNNER_TEMP/d2-${D2_VERSION}/bin/d2" "$HOME/.local/bin/d2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/d2" --version

      - name: Install dependencies
        run: npm ci --prefix docsite

      - name: Build verified docsite
        run: npm --prefix docsite run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docsite/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
