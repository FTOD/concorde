schema_version: "1.0"

extension:
  id: "concorde"
  name: "Concorde Architecture Workflow"
  version: "0.9.0"
  description: "Initialize, retrieve, validate, deliver, and explain module-centered architecture and features"
  author: "Concorde maintainers"
  repository: "https://github.com/FTOD/concorde"
  license: "MIT"

requires:
  speckit_version: ">=0.16.4,<0.16.5"

provides:
  commands:
    - name: "speckit.concorde.init"
      file: "commands/speckit.concorde.init.md"
      description: "Propose and explicitly apply a root Concorde specification hierarchy"
    - name: "speckit.concorde.deliver"
      file: "commands/speckit.concorde.deliver.md"
      description: "Validate a completed attempt and atomically remove only its temporal workspace"
    - name: "speckit.concorde.context"
      file: "commands/speckit.concorde.context.md"
      description: "Retrieve exactly one bounded architectural level"
    - name: "speckit.concorde.validate"
      file: "commands/speckit.concorde.validate.md"
      description: "Deterministically validate Concorde architecture sources"
    - name: "speckit.concorde.ask"
      file: "commands/speckit.concorde.ask.md"
      description: "Answer a grounded, read-only question about the Concorde workflow or framework"
  scripts:
    - name: "concorde-bash"
      file: "scripts/bash/concorde.sh"
      runtime: "bash"
      description: "POSIX Concorde runtime launcher"
    - name: "concorde-powershell"
      file: "scripts/powershell/concorde.ps1"
      runtime: "powershell"
      description: "PowerShell Concorde runtime launcher"
    - name: "concorde-python"
      file: "scripts/python/concorde.py"
      runtime: "python"
      description: "Python Concorde runtime launcher"
    - name: "concorde-workspace-python"
      file: "scripts/python/workspace.py"
      runtime: "python"
      description: "Portable Protocol 12 adapter for one direct feature file and stable-ID project-control context"
    - name: "concorde-reflections-queue-python"
      file: "scripts/python/reflections_queue.py"
      runtime: "python"
      description: "Deterministic reflection-triage/v3 queue, ID allocation, plan state, and merged-small removal helper"

effect: "read-write"

tags:
  - "architecture"
  - "interfaces"
  - "modules"
  - "context"
  - "validation"
