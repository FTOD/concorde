schema_version: "1.0"

preset:
  id: "concorde"
  name: "Concorde"
  version: "0.9.0"
  description: "Module-centered architecture and direct-file feature workflow for Spec Kit"
  author: "Concorde maintainers"
  repository: "https://github.com/FTOD/concorde"
  license: "MIT"

requires:
  speckit_version: ">=0.16.4,<0.16.5"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/design-template.md"
      description: "Concorde direct feature file with embedded interfaces, usage, and architecture-zoom guidance"
      strategy: "append"
    - type: "template"
      name: "reflections-template"
      file: "templates/reflections-template.md"
      description: "Tracked project-wide reflection log with atomic ID allocation and eligible merged-small removal"
      strategy: "replace"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Concorde bounded architecture planning gates"
      strategy: "replace"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Concorde architecture and evidence task guidance"
      strategy: "replace"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create or revise one direct level-local feature file"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify one selected direct feature file and its embedded interfaces"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Route requirements checklists to the stable-ID project-control attempt"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Route implementation planning to the stable-ID project-control attempt"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Route task generation to the stable-ID project-control attempt"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Execute one feature attempt against design, architecture, code, and tests"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze the selected temporal implementation artifacts"
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Converge the selected temporal implementation artifacts"
      strategy: "replace"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Convert tasks from the selected attempt workspace"
      strategy: "replace"
    - type: "command"
      name: "speckit.fast-loop"
      file: "commands/speckit.fast-loop.md"
      description: "Directly reconcile one eligible small change without an attempt"
      strategy: "replace"

tags:
  - "architecture"
  - "interfaces"
  - "modules"
  - "spec-driven-development"
