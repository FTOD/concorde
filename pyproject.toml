[project]
name = "concorde-development"
version = "0.0.0"
description = "Development environment for the Concorde Spec Kit integration"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "specify-cli==0.16.4",
]

[tool.uv]
package = false

[tool.concorde]
python = "3.11"
test-command = "uv run python -m unittest discover -s tests/concorde -t . -p test_*.py"
