[project]
name = "concorde-development"
version = "0.0.0"
description = "Development environment for the standalone Concorde workflow"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "langgraph>=1.2,<2",
]

[tool.uv]
package = false

[tool.concorde]
python = "3.11"
test-command = ".venv/bin/python -m unittest discover -s tests/concorde -t . -p test_*.py"
