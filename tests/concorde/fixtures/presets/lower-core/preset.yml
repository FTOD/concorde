schema_version: "1.0"

preset:
  id: "lower-core-fixture"
  name: "Lower Core Fixture"
  version: "0.1.0"
  description: "Lower-priority command layer used to verify recomposition"
  author: "Concorde tests"
  license: "MIT"

requires:
  speckit_version: ">=0.16.4,<0.16.5"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/lower.md"
      strategy: "replace"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/lower.md"
      strategy: "replace"
